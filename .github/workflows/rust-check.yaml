name: Rust check

on:
  workflow_dispatch:
#  push:
#    paths:
#      - "deemix/Cargo.toml"
#      - "deemix/telegram_bot/**"

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deemix
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Prepare cargo layout (mirrors Dockerfile build stage)
        run: |
          mkdir -p src
          cp telegram_bot/*.rs src/
      - run: cargo check

[package]
name = "telegram_bot"
version = "0.1.0"
edition = "2021"

[dependencies]
teloxide = { version = "0.17", features = ["macros", "rustls"], default-features = false }
reqwest = { version = "0.13", features = ["json", "cookies", "rustls", "multipart", "query"], default-features = false }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.26"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
log = "0.4"
env_logger = "0.11"
futures-util = "0.3"

# Required for working with the ACRCloud API:
base64 = "0.23"
hmac = "0.13"
sha1 = "0.11"

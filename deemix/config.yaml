name: "Deemix"
slug: "deemix"
version: "4.0.7-1"
description: "Deemix - Music Downloader"
url: "https://github.com/theodorx7/ha-deemix/"
image: "ghcr.io/theodorx7/deemix"
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
map:
  - addon_config:rw
  - media:rw
  - share:rw
  - ssl:ro

# Порт для веб-интерфейса
ports:
  6595/tcp: 6595
ports_description:
  6595/tcp: "Deemix WebUI"
# Веб-интерфейс (прямой доступ)
webui: "[PROTO:ssl]://[HOST]:[PORT:6595]"

options:
  env_vars: []
  server_port: 6595
  host: "0.0.0.0"
schema:
  env_vars:
    - name: "match(^[A-Za-z_][A-Za-z0-9_]*$)"
      value: "str?"
  server_port: "port"
  host: "str"

name: "Deemix"
slug: "deemix"
version: "4.7.0"
description: "Deemix - Music Downloader"
url: "https://github.com/theodorx7/ha-deemix/"
image: "ghcr.io/theodorx7/ha-deemix"
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
map:
  - addon_config:rw
  - media:rw
  - share:rw

# Порт для веб-интерфейса
ports:
  6595/tcp: 6595
ports_description:
  6595/tcp: "Deemix WebUI"
# Веб-интерфейс (прямой доступ)
webui: "http://[HOST]:[PORT:6595]"

options:
  env_vars:
    - name: DEEMIX_MUSIC_DIR
      value: /media/downloads/
schema:
  env_vars:
    - name: "match(^[A-Za-z_][A-Za-z0-9_]*$)"
      value: "str?"

name: "Deemix"
slug: "deemix"
version: "4.0.7-1"
description: "Deemix - Music Downloader"
url: "https://github.com/theodorx7/ha-deemix/"
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto

# Маппинг директорий HA
map:
  - addon_config:rw      # /config внутри контейнера
  - media:rw             # /media внутри контейнера
  - share:rw             # /share внутри контейнера
  - ssl:rw               # /ssl для сертификатов

# Порт для веб-интерфейса
ports:
  6595/tcp: 6595
ports_description:
  6595/tcp: "Deemix WebUI"

# Веб-интерфейс (прямой доступ)
webui: "[PROTO:ssl]://[HOST]:[PORT:6595]"

# Панель в боковой панели HA
panel_icon: "mdi:music-circle"
panel_title: "Deemix"
panel_admin: true

# Опции по умолчанию
options:
  server_port: 6595
  host: "0.0.0.0"
  ssl: false
  certfile: fullchain.pem
  keyfile: privkey.pem

# Схема валидации
schema:
  server_port: "port"
  host: "str"
  ssl: bool
  certfile: "str?"
  keyfile: "str?"

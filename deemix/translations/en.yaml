configuration:
  env_vars:
    name: Environment Variables
    fields:
      name:
        name: Variable Name
        description: >-
          Environment variable name (e.g. DEEMIX_MUSIC_DIR, PUID, PGID).
          Must contain only letters, numbers and underscores.
      value:
        name: Value
        description: >-
          Environment variable value (e.g. /media/downloads/ for
          DEEMIX_MUSIC_DIR, 1000 for PUID).

          DEEMIX_MUSIC_DIR, 1000 for PUID).
  # НОВЫЕ ПЕРЕВОДЫ для Teleemix:
  telegram_enabled:
    name: Enable Telegram Bot
    description: >-
      Enable the Teleemix Telegram bot for remote music downloads.
      Requires a Telegram bot token from @BotFather.
  telegram_token:
    name: Telegram Bot Token
    description: >-
      Bot token obtained from @BotFather in Telegram.
      Required if Telegram Bot is enabled.
  deemix_arl:
    name: Deezer ARL
    description: >-
      Your Deezer ARL token for authentication.
      Get it from your browser cookies on deezer.com.
      Required for downloading music.
  deemix_bitrate:
    name: Download Quality
    description: >-
      Audio quality for downloads:
      1 = MP3 128kbps (free accounts),
      3 = MP3 320kbps (Premium),
      9 = FLAC lossless (HiFi/Premium+).
  deemix_bitrate_lock:
    name: Lock Quality
    description: >-
      Prevent users from changing the download quality
      via the Telegram bot /settings command.
  audd_api_key:
    name: AudD API Key
    description: >-
      Optional: API key for song recognition from voice recordings.
      Get a free key at https://audd.io/ (100 recognitions/month).
      Leave empty to disable song recognition.
  openai_api_key:
    name: OpenAI API Key
    description: >-
      Optional: OpenAI API key for voice note transcription.
      Required for voice search feature.
      Leave empty to disable voice search.
  whisper_url:
    name: Whisper Server URL
    description: >-
      Optional: URL to your self-hosted Whisper server.
      Alternative to OpenAI API for voice transcription.
      Leave empty to use OpenAI or disable voice search.

network:
  6595/tcp: "Deemix WebIU"

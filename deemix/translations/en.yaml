configuration:
  env_vars:
    name: Environment Variables
    description: >-
      Custom environment variables passed to the Deemix container.
      Use DEEMIX_MUSIC_DIR to set the music download folder,
      PUID/PGID for file ownership, or any other Deemix setting.
    fields:
      name:
        name: Variable Name
        description: >-
          Environment variable name (e.g. DEEMIX_MUSIC_DIR, PUID, PGID).
          Must contain only letters, numbers and underscores.
      value:
        name: Value
        description: >-
          Environment variable value (e.g. /media/Downloads/ for
          DEEMIX_MUSIC_DIR, 911 for PUID).

network:
  6595/tcp: "Deemix Web Interface"

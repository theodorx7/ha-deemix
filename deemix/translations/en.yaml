configuration:
  env_vars:
    name: Environment Variables
    fields:
      name:
        name: Variable Name
        description: >-
          Environment variable name (e.g. DEEMIX_MUSIC_DIR, PUID, PGID).
          Must contain only letters, numbers and underscores.
      value:
        name: Value
        description: >-
          Environment variable value (e.g. /media/downloads/ for
          DEEMIX_MUSIC_DIR, 1000 for PUID).
  telegram_enabled:
    name: Enable Telegram Bot
    description: >-
      Enable the Telegram bot for remote music downloads.
      Requires a Telegram bot token from @BotFather.
  telegram_token:
    name: Telegram Bot Token
    description: >-
      Bot token obtained from @BotFather in Telegram.
      Required if Telegram Bot is enabled.
  whitelist_enabled:
    name: "Access Control"
    description: >-
      Restrict bot access to only whitelisted user IDs.
  whitelist_ids:
    name: "Allowed User Telegram IDs"
    description: >-
      Comma-separated list of Telegram user IDs allowed to use the bot.
      Get your ID via @userinfobot on Telegram.
      Spaces around IDs are trimmed automatically. Invalid IDs are ignored.
      Example: 123456789,987654321
  deemix_bitrate_lock:
    name: Lock Quality
    description: >-
      Prevent users from changing the download quality
      via the Telegram bot /settings command.
  acrcloud_host:
    name: ACRCloud Host
    description: >-
      Recognition host of your ACRCloud project (shown in the ACRCloud
      console, e.g. identify-eu-west-1.acrcloud.com).
  acrcloud_access_key:
    name: ACRCloud Access Key
    description: >-
      Access key of your ACRCloud Audio & Video Recognition project.
      Required together with the Secret Key; enables the song
      recognition feature.
  acrcloud_secret_key:
    name: ACRCloud Secret Key
    description: >-
      Secret key of your ACRCloud Audio & Video Recognition project.
      Required together with the Access Key.
  openai_api_key:
    name: OpenAI API Key
    description: >-
      API key for transcribing voice messages via OpenAI Whisper.
      Optional; enables voice search.
  whisper_url:
    name: Whisper Server URL
    description: >-
      URL of a local Whisper-compatible server for transcribing
      voice messages. Optional; alternative to the OpenAI API key.
network:
  6595/tcp: "Deemix WebUI"

<!doctype html>
<html class="h-screen" data-theme="dark" dir="ltr" lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Deemix</title>
		<link rel="shortcut icon" type="image/png" href="favicon.png" />
		<meta
			content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=0, viewport-fit=cover"
			name="viewport"
		/>
		<style>
			body {
				background: hsl(240, 10%, 8%);
				color: hsl(0, 0%, 93%);
			}
		</style>
		<script>
			// --- LOCAL PATCH: namespaced theme localStorage key ---
			// Reason: under Home Assistant Ingress the UI shares localStorage with
			// the HA frontend, which uses the same unnamespaced "selectedTheme" key
			// for its own theme settings (stored as a JSON object). That foreign
			// value was applied verbatim as data-theme, matching no theme CSS and
			// leaving the page unstyled until a theme was picked manually.
			// Original (upstream deemix-webui@4.7.0):
			// if (localStorage.getItem("selectedTheme")) {
			// 	document.documentElement.setAttribute(
			// 		"data-theme",
			// 		localStorage.getItem("selectedTheme")
			// 	);
			// }
			if (localStorage.getItem("deemix-selectedTheme")) {
				document.documentElement.setAttribute(
					"data-theme",
					localStorage.getItem("deemix-selectedTheme")
				);
			}
			// --- END LOCAL PATCH ---
		</script>
	</head>

	<body
		class="bg-background-main text-foreground h-full w-full overflow-hidden bg-[hsl(240deg,10%,8%)] font-sans"
	>
		<div id="app"></div>
	</body>

	<script type="module" src="/src/client/main.ts"></script>
</html>
